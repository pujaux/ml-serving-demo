name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Train model
        run: python train.py
      - name: Run tests
        run: python -m pytest -v
      - name: Build Docker image
        run: docker build -t ml-serving-demo .